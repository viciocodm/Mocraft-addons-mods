<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mocraft mods/Addons - java/bedrock</title>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --mc-bg: #121212;
      --mc-surface: #1e1e1e;
      --mc-accent: #388e3c;
      --mc-accent-hover: #2e7d32;
      --mc-text: #ffffff;
      --mc-text-muted: #aaaaaa;
      --mc-border: #333333;
      --mc-danger: #d32f2f;
      --mc-bg-overlay: rgba(0, 0, 0, 0.7);
    }

    .light-mode {
      --mc-bg: #f4f4f9;
      --mc-surface: #ffffff;
      --mc-accent: #4caf50;
      --mc-accent-hover: #388e3c;
      --mc-text: #212121;
      --mc-text-muted: #666666;
      --mc-border: #e0e0e0;
      --mc-danger: #f44336;
      --mc-bg-overlay: rgba(255, 255, 255, 0.7);
    }

    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--mc-bg);
      color: var(--mc-text);
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      background-color: var(--mc-surface);
      border-bottom: 2px solid var(--mc-border);
      padding: 15px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--mc-accent);
      text-transform: capitalize;
    }

    nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button, .nav-btn {
      background-color: var(--mc-accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    button:hover, .nav-btn:hover {
      background-color: var(--mc-accent-hover);
    }

    .theme-toggle {
      background-color: transparent;
      border: 1px solid var(--mc-border);
      color: var(--mc-text);
    }

    main {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .filters-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filters-bar input, .filters-bar select, .form-group input, .form-group select, .form-group textarea {
      background-color: var(--mc-surface);
      color: var(--mc-text);
      border: 1px solid var(--mc-border);
      padding: 10px;
      border-radius: 4px;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--mc-surface);
      border: 1px solid var(--mc-border);
      border-radius: 6px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card img.main-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .card-screenshots {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    .card-screenshots img {
      width: 32%;
      height: 50px;
      object-fit: cover;
      border-radius: 2px;
    }

    .card-title {
      font-size: 1.2rem;
      margin: 0 0 5px 0;
    }

    .card-author {
      font-size: 0.85rem;
      color: var(--mc-text-muted);
      margin-bottom: 10px;
    }

    .edition-badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 0.75rem;
      border-radius: 3px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .edition-bedrock { background-color: #2e7d32; color: white; }
    .edition-java { background-color: #c62828; color: white; }
    .edition-both { background-color: #1565c0; color: white; }

    .version-tag {
      font-size: 0.75rem;
      background-color: var(--mc-border);
      padding: 3px 6px;
      border-radius: 3px;
      margin-left: 5px;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--mc-text-muted);
      margin-bottom: 15px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .btn-like {
      background-color: transparent;
      border: 1px solid var(--mc-border);
      color: var(--mc-text);
      padding: 5px 10px;
    }

    .btn-download {
      width: 100%;
      margin-top: 10px;
    }

    .btn-delete {
      background-color: var(--mc-danger);
      width: 100%;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 20px;
    }

    .pagination button {
      background-color: var(--mc-surface);
      border: 1px solid var(--mc-border);
      color: var(--mc-text);
    }

    .pagination button.active {
      background-color: var(--mc-accent);
      color: white;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--mc-text-muted);
      grid-column: 1 / -1;
    }

    .profile-card {
      background-color: var(--mc-surface);
      border: 1px solid var(--mc-border);
      padding: 20px;
      border-radius: 6px;
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
    }

    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mocraft Mods/Addons - java/bedrock</h1>
    <nav>
      <button class="nav-btn" onclick="switchTab('exploreTab')">Explorar</button>
      <button class="nav-btn" onclick="switchTab('uploadTab')">+ Subir Mod</button>
      <button class="nav-btn" onclick="switchTab('profileTab')">Mi Perfil</button>
      <button class="theme-toggle" onclick="toggleTheme()">🌙 Modo Oscuro</button>
    </nav>
  </header>

  <main>
    <!-- TAB EXPLORAR -->
    <div id="exploreTab" class="tab-content active">
      <h2>Contenido Publicado</h2>
      <div class="filters-bar">
        <input type="text" id="searchInput" placeholder="Buscar por título..." oninput="filterAddons()">
        <select id="filterCategory" onchange="filterAddons()">
          <option value="all">Todas las categorías</option>
          <option value="Mods / Addons">Mods / Addons</option>
          <option value="Texturas">Texturas</option>
          <option value="Mapas">Mapas</option>
          <option value="Skins">Skins</option>
        </select>
        <select id="filterVersion" onchange="filterAddons()">
          <option value="all">Todas las versiones</option>
          <option value="1.26">Minecraft 1.26</option>
          <option value="1.21">Minecraft 1.21</option>
          <option value="1.20">Minecraft 1.20</option>
          <option value="1.19">Minecraft 1.19</option>
        </select>
      </div>

      <div id="addonsGrid" class="grid"></div>
      <div id="paginationContainer" class="pagination"></div>
    </div>

    <!-- TAB SUBIR MOD -->
    <div id="uploadTab" class="tab-content">
      <h2>Publicar Nuevo Contenido</h2>
      <form id="addonForm">
        <div class="form-group">
          <label for="title">Título del Mod/Addon</label>
          <input type="text" id="title" required placeholder="Ej. Furniture Addon v2">
        </div>

        <div class="form-group">
          <label for="edition">Edición</label>
          <select id="edition" required>
            <option value="Bedrock Edition">Bedrock Edition (.mcaddon / .mcpack)</option>
            <option value="Java Edition">Java Edition (.jar / .zip)</option>
            <option value="Java & Bedrock">Java & Bedrock</option>
          </select>
        </div>

        <div class="form-group">
          <label for="mcVersion">Versión de Minecraft</label>
          <select id="mcVersion" required>
            <option value="1.26">Minecraft 1.26</option>
            <option value="1.21">Minecraft 1.21</option>
            <option value="1.20">Minecraft 1.20</option>
            <option value="1.19">Minecraft 1.19</option>
          </select>
        </div>

        <div class="form-group">
          <label for="category">Categoría</label>
          <select id="category" required>
            <option value="Mods / Addons">Mods / Addons</option>
            <option value="Texturas">Texturas</option>
            <option value="Mapas">Mapas</option>
            <option value="Skins">Skins</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Descripción</label>
          <textarea id="description" rows="4" required placeholder="Describe las funciones de tu creación..."></textarea>
        </div>

        <div class="form-group">
          <label for="image">Imagen Principal (Carátula)</label>
          <input type="file" id="image" accept="image/*" required>
        </div>

        <div class="form-group">
          <label for="screenshots">Capturas de Pantalla Adicionales (Máx. 3)</label>
          <input type="file" id="screenshots" accept="image/*" multiple>
        </div>

        <div class="form-group">
          <label for="modFile">Archivo (.mcaddon, .mcpack, .zip, .jar)</label>
          <input type="file" id="modFile" required>
        </div>

        <button type="submit" id="submitBtn">Publicar Inmediatamente</button>
      </form>
    </div>

    <!-- TAB PERFIL -->
    <div id="profileTab" class="tab-content">
      <div class="profile-card">
        <img id="profileAvatar" class="profile-avatar" src="https://via.placeholder.com/100?text=User" alt="Avatar">
        <h2 id="profileUsername">Nombre de Usuario</h2>
        <p id="profileEmail">correo@ejemplo.com</p>
        <p id="profileBio">Sin biografía.</p>
        <button onclick="editProfile()">Editar Perfil</button>
        <button style="background-color: var(--mc-danger);" onclick="resetProfile()">Cerrar Sesión</button>
      </div>
    </div>
  </main>

  <script>
    // --- CONEXIÓN DE SUPABASE INTEGRADAS ---
    const SUPABASE_URL = 'https://yclanqvpverqbyidpvjm.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljbGFucXZwdmVycWJ5aWRwdmptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMDYwNzEsImV4cCI6MjEwMzg4MjA3MX0.qyG1dfdMVdb0pkKd_Dv9Y5xoOxx9qBGlKfdscp8oR6E';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    function getCreatorBadge(username, email) {
      if (
        username && username.trim().toLowerCase() === "richard" && 
        email && email.trim().toLowerCase() === "rbenavides986@gmail.com"
      ) {
        return `<span style="background: #2e7d32; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-left: 6px;" title="Creador Oficial del Sitio">✔ Creador</span>`;
      }
      return '';
    }

    let loadedAddons = [];
    let filteredAddonsList = [];
    let currentPage = 1;
    const itemsPerPage = 6;

    // Utilidades
    function sanitizeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
    }

    // Perfil Local
    function renderProfile() {
      let user = JSON.parse(localStorage.getItem('user_profile'));
      if (!user) {
        user = {
          username: "Richard",
          email: "rbenavides986@gmail.com",
          bio: "Soy el creador de este sitio web",
          avatar: "https://via.placeholder.com/100?text=MC"
        };
        localStorage.setItem('user_profile', JSON.stringify(user));
      }
      document.getElementById('profileUsername').innerHTML = user.username + getCreatorBadge(user.username, user.email);
      document.getElementById('profileEmail').innerText = user.email;
      document.getElementById('profileBio').innerText = user.bio;
      document.getElementById('profileAvatar').src = user.avatar;
    }

    function editProfile() {
      const user = JSON.parse(localStorage.getItem('user_profile'));
      const newName = prompt('Nuevo Nombre de Usuario:', user.username);
      const newBio = prompt('Nueva Biografía:', user.bio);
      if (newName) user.username = newName;
      if (newBio) user.bio = newBio;
      localStorage.setItem('user_profile', JSON.stringify(user));
      renderProfile();
    }

    function resetProfile() {
      if (confirm('¿Cerrar sesión y restablecer perfil local?')) {
        localStorage.removeItem('user_profile');
        renderProfile();
      }
    }

    // Compresión de imágenes
    function compressImage(file, maxWidth = 800, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
        };
      });
    }

    // Cargar Addons desde Supabase (Global)
    async function loadAddons() {
      try {
        const { data, error } = await _supabase
          .from('addons')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        loadedAddons = data || [];
        filterAddons();
      } catch (err) {
        console.error('Error al cargar contenido de Supabase:', err);
      }
    }

    // Guardar nuevo Addon en Supabase
    const addonForm = document.getElementById('addonForm');
    addonForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "Procesando y Guardando...";
      btn.disabled = true;

      try {
        const user = JSON.parse(localStorage.getItem('user_profile'));
        const author = user ? user.username : 'Richard';

        const title = sanitizeHTML(document.getElementById('title').value);
        const edition = sanitizeHTML(document.getElementById('edition').value);
        const mcVersion = sanitizeHTML(document.getElementById('mcVersion').value);
        const category = sanitizeHTML(document.getElementById('category').value);
        const description = sanitizeHTML(document.getElementById('description').value);

        const mainImageFile = document.getElementById('image').files[0];
        const mainImageBase64 = await compressImage(mainImageFile, 800, 0.7);

        const screenshotFiles = Array.from(document.getElementById('screenshots').files).slice(0, 3);
        const screenshotsBase64 = [];
        for (const file of screenshotFiles) {
          const base64 = await compressImage(file, 600, 0.7);
          screenshotsBase64.push(base64);
        }

        const modFile = document.getElementById('modFile').files[0];

        const newAddon = {
          title,
          edition,
          mcVersion,
          category,
          description,
          author,
          likes: 0,
          mainImage: mainImageBase64,
          screenshots: screenshotsBase64,
          fileName: modFile.name
        };

        const { error } = await _supabase
          .from('addons')
          .insert([newAddon]);

        if (error) throw error;

        addonForm.reset();
        alert('¡Contenido publicado exitosamente en la nube!');
        await loadAddons();
        switchTab('exploreTab');
      } catch (error) {
        alert('Ocurrió un error al guardar el contenido: ' + error.message);
      } finally {
        btn.innerText = "Publicar Inmediatamente";
        btn.disabled = false;
      }
    });

    function filterAddons() {
      const searchInput = document.getElementById('searchInput');
      const filterCat = document.getElementById('filterCategory');
      const filterVer = document.getElementById('filterVersion');
      if (!searchInput || !filterCat || !filterVer) return;

      const search = searchInput.value.toLowerCase();
      const cat = filterCat.value;
      const ver = filterVer.value;

      filteredAddonsList = loadedAddons.filter(item => {
        const matchesSearch = item.title.toLowerCase().includes(search);
        const matchesCategory = cat === 'all' || item.category === cat;
        const matchesVersion = ver === 'all' || item.mcVersion === ver;
        return matchesSearch && matchesCategory && matchesVersion;
      });

      currentPage = 1;
      renderGrid();
    }

    async function toggleLike(id) {
      const item = loadedAddons.find(a => a.id === id);
      if (item) {
        const newLikes = (item.likes || 0) + 1;
        const { error } = await _supabase
          .from('addons')
          .update({ likes: newLikes })
          .eq('id', id);

        if (!error) loadAddons();
      }
    }

    function renderGrid() {
      const grid = document.getElementById('addonsGrid');
      const pagination = document.getElementById('paginationContainer');
      if (!grid || !pagination) return;
      
      grid.innerHTML = '';
      pagination.innerHTML = '';

      if (filteredAddonsList.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h3>No hay contenido disponible</h3>
            <p>Sé el primero en publicar un mod, mapa o textura en la pestaña "Subir Mod".</p>
          </div>`;
        return;
      }

      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const itemsToDisplay = filteredAddonsList.slice(start, end);

      itemsToDisplay.forEach(item => {
        let badgeClass = 'edition-bedrock';
        if (item.edition === 'Java Edition') badgeClass = 'edition-java';
        if (item.edition === 'Java & Bedrock') badgeClass = 'edition-both';

        let screenshotsHTML = '';
        if (item.screenshots && item.screenshots.length > 0) {
          screenshotsHTML = `<div class="card-screenshots">` +
            item.screenshots.map(src => `<img src="${src}" alt="Screenshot">`).join('') +
            `</div>`;
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <img class="main-img" src="${item.mainImage}" alt="${item.title}">
            ${screenshotsHTML}
            <h3 class="card-title">${item.title}</h3>
            <div class="card-author">Por: <strong>${item.author}</strong></div>
            <div>
              <span class="edition-badge ${badgeClass}">${item.edition}</span>
              <span class="version-tag">v${item.mcVersion || '1.26'}</span>
            </div>
            <p class="card-desc">${item.description}</p>
          </div>
          <div>
            <div class="card-actions">
              <button type="button" class="btn-like" onclick="toggleLike(${item.id})">❤️ ${item.likes || 0}</button>
              <span style="color: gold;">★★★★★</span>
            </div>
            <button type="button" class="btn-download" onclick="alert('Descargando: ${item.fileName}')">📦 Descargar (${item.fileName})</button>
            <button type="button" class="btn-delete" onclick="deleteAddon(${item.id})">🗑️ Eliminar</button>
          </div>
        `;
        grid.appendChild(card);
      });

      const totalPages = Math.ceil(filteredAddonsList.length / itemsPerPage);     if (totalPages > 1) {
        for (let i = 1; i <= totalPages; i++) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.innerText = i;
          if (i === currentPage) btn.className = 'active';
          btn.onclick = () => {
            currentPage = i;
            renderGrid();
          };
          pagination.appendChild(btn);
        }
      }
    }

    async function deleteAddon(id) {
      if (confirm('¿Estás seguro de que deseas eliminar este contenido?')) {
        const { error } = await _supabase
          .from('addons')
          .delete()
          .eq('id', id);

        if (!error) loadAddons();
        else alert('Error al eliminar: ' + error.message);
      }
    }

    // Inicializar al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
      loadAddons();
      renderProfile();
    });
  </script>
</body>
</html>
