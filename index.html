<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mocraft mods/Addons - java/bedrock</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --mc-bg: #121212;
      --mc-surface: #1e1e1e;
      --mc-accent: #388e3c;
      --mc-accent-hover: #2e7d32;
      --mc-text: #ffffff;
      --mc-text-muted: #aaaaaa;
      --mc-border: #333333;
      --mc-danger: #d32f2f;
      --mc-bg-overlay: rgba(0, 0, 0, 0.7);
    }

    .light-mode {
      --mc-bg: #f4f4f9;
      --mc-surface: #ffffff;
      --mc-accent: #4caf50;
      --mc-accent-hover: #388e3c;
      --mc-text: #212121;
      --mc-text-muted: #666666;
      --mc-border: #e0e0e0;
      --mc-danger: #f44336;
      --mc-bg-overlay: rgba(255, 255, 255, 0.7);
    }

    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--mc-bg);
      color: var(--mc-text);
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      background-color: var(--mc-surface);
      border-bottom: 2px solid var(--mc-border);
      padding: 15px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--mc-accent);
      text-transform: capitalize;
    }

    nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button, .nav-btn {
      background-color: var(--mc-accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    button:hover, .nav-btn:hover {
      background-color: var(--mc-accent-hover);
    }

    .theme-toggle {
      background-color: transparent;
      border: 1px solid var(--mc-border);
      color: var(--mc-text);
    }

    main {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .filters-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filters-bar input, .filters-bar select, .form-group input, .form-group select, .form-group textarea {
      background-color: var(--mc-surface);
      color: var(--mc-text);
      border: 1px solid var(--mc-border);
      padding: 10px;
      border-radius: 4px;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--mc-surface);
      border: 1px solid var(--mc-border);
      border-radius: 6px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card img.main-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .card-screenshots {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    .card-screenshots img {
      width: 32%;
      height: 50px;
      object-fit: cover;
      border-radius: 2px;
    }

    .card-title {
      font-size: 1.2rem;
      margin: 0 0 5px 0;
    }

    .card-author {
      font-size: 0.85rem;
      color: var(--mc-text-muted);
      margin-bottom: 10px;
    }

    .edition-badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 0.75rem;
      border-radius: 3px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .edition-bedrock { background-color: #2e7d32; color: white; }
    .edition-java { background-color: #c62828; color: white; }
    .edition-both { background-color: #1565c0; color: white; }

    .version-tag {
      font-size: 0.75rem;
      background-color: var(--mc-border);
      padding: 3px 6px;
      border-radius: 3px;
      margin-left: 5px;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--mc-text-muted);
      margin-bottom: 15px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .btn-like {
      background-color: transparent;
      border: 1px solid var(--mc-border);
      color: var(--mc-text);
      padding: 5px 10px;
    }

    .btn-download {
      width: 100%;
      margin-top: 10px;
    }

    .btn-delete {
      background-color: var(--mc-danger);
      width: 100%;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 20px;
    }

    .pagination button {
      background-color: var(--mc-surface);
      border: 1px solid var(--mc-border);
      color: var(--mc-text);
    }

    .pagination button.active {
      background-color: var(--mc-accent);
      color: white;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--mc-text-muted);
      grid-column: 1 / -1;
    }

    .profile-card {
      background-color: var(--mc-surface);
      border: 1px solid var(--mc-border);
      padding: 20px;
      border-radius: 6px;
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
    }

    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
    }

    .profile-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--mc-bg-overlay);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }
    .profile-modal-content {
      background-color: var(--mc-surface);
      border: 1px solid var(--mc-border);
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .profile-modal-content label {
      font-size: 0.85rem;
      font-weight: bold;
      text-align: left;
    }
    .profile-modal-content input, .profile-modal-content textarea {
      background-color: var(--mc-bg);
      color: var(--mc-text);
      border: 1px solid var(--mc-border);
      padding: 8px 10px;
      border-radius: 4px;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mocraft mods/Addons - java/bedrock</h1>
    <nav>
      <button class="nav-btn" onclick="switchTab('exploreTab')">Explorar</button>
      <button class="nav-btn" onclick="switchTab('uploadTab')">+ Subir Mod</button>
      <button class="nav-btn" onclick="switchTab('profileTab')">Mi Perfil</button>
      <button class="theme-toggle" onclick="toggleTheme()">🌙 Modo Oscuro</button>
    </nav>
  </header>

  <main>
    <div id="exploreTab" class="tab-content active">
      <h2>Contenido Publicado</h2>
      <div class="filters-bar">
        <input type="text" id="searchInput" placeholder="Buscar por título..." oninput="filterAddons()">
        <select id="filterCategory" onchange="filterAddons()">
          <option value="all">Todas las categorías</option>
          <option value="Mods / Addons">Mods / Addons</option>
          <option value="Texturas">Texturas</option>
          <option value="Mapas">Mapas</option>
          <option value="Skins">Skins</option>
        </select>
        <select id="filterVersion" onchange="filterAddons()">
          <option value="all">Todas las versiones</option>
          <option value="1.26">Minecraft 1.26</option>
          <option value="1.21">Minecraft 1.21</option>
          <option value="1.20">Minecraft 1.20</option>
          <option value="1.19">Minecraft 1.19</option>
        </select>
      </div>

      <div id="addonsGrid" class="grid"></div>
      <div id="paginationContainer" class="pagination"></div>
    </div>

    <div id="uploadTab" class="tab-content">
      <h2>Publicar Nuevo Contenido</h2>
      <form id="addonForm">
        <div class="form-group">
          <label for="title">Título del Mod/Addon</label>
          <input type="text" id="title" required placeholder="Ej. Furniture Addon v2">
        </div>

        <div class="form-group">
          <label for="edition">Edición</label>
          <select id="edition" required>
            <option value="Bedrock Edition">Bedrock Edition (.mcaddon / .mcpack)</option>
            <option value="Java Edition">Java Edition (.jar / .zip)</option>
            <option value="Java & Bedrock">Java & Bedrock</option>
          </select>
        </div>

        <div class="form-group">
          <label for="mcVersion">Versión de Minecraft</label>
          <select id="mcVersion" required>
            <option value="1.26">Minecraft 1.26</option>
            <option value="1.21">Minecraft 1.21</option>
            <option value="1.20">Minecraft 1.20</option>
            <option value="1.19">Minecraft 1.19</option>
          </select>
        </div>

        <div class="form-group">
          <label for="category">Categoría</label>
          <select id="category" required>
            <option value="Mods / Addons">Mods / Addons</option>
            <option value="Texturas">Texturas</option>
            <option value="Mapas">Mapas</option>
            <option value="Skins">Skins</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Descripción</label>
          <textarea id="description" rows="4" required placeholder="Describe las funciones de tu creación..."></textarea>
        </div>

        <div class="form-group">
          <label for="image">Imagen Principal (Carátula)</label>
          <input type="file" id="image" accept="image/*" required>
        </div>

        <div class="form-group">
          <label for="screenshots">Capturas de Pantalla Adicionales (Máx. 3)</label>
          <input type="file" id="screenshots" accept="image/*" multiple>
        </div>

        <div class="form-group">
          <label for="modFile">Archivo (.mcaddon, .mcpack, .zip, .jar)</label>
          <input type="file" id="modFile" required>
        </div>

        <button type="submit" id="submitBtn">Publicar Inmediatamente</button>
      </form>
    </div>

    <div id="profileTab" class="tab-content">
      <div class="profile-card">
        <img id="profileAvatar" class="profile-avatar" src="https://via.placeholder.com/100?text=User" alt="Avatar">
        <h2 id="profileUsername">Nombre de Usuario</h2>
        <p id="profileEmail">correo@ejemplo.com</p>
        <p id="profileBio">Sin biografía.</p>
        <div id="profileSocials" style="font-size: 0.85rem; color: var(--mc-text-muted); margin: 10px 0;"></div>
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
          <button onclick="editProfileModal()">Editar Perfil</button>
          <button id="logoutBtn" style="background-color: var(--mc-danger);" onclick="resetProfile()">Cerrar Sesión</button>
        </div>
      </div>
    </div>
  </main>

  <div id="profileModal" class="profile-modal">
    <div class="profile-modal-content">
      <h3 style="margin: 0 0 10px 0; text-align: center;">Editar Perfil</h3>
      
      <label>Nombre de Usuario:</label>
      <input type="text" id="modalUsername" placeholder="Tu nombre">

      <label>Correo Electrónico:</label>
      <input type="email" id="modalEmail" placeholder="correo@ejemplo.com">

      <label>Biografía:</label>
      <textarea id="modalBio" rows="2" placeholder="Cuéntanos algo de ti"></textarea>

      <label>Foto de Perfil (URL de la imagen):</label>
      <input type="text" id="modalAvatar" placeholder="https://...">

      <label>YouTube:</label>
      <input type="text" id="modalYt" placeholder="Enlace de YouTube">

      <label>TikTok:</label>
      <input type="text" id="modalTk" placeholder="Usuario de TikTok">

      <label>Discord:</label>
      <input type="text" id="modalDc" placeholder="Usuario de Discord">

      <div style="display: flex; justify-content: space-between; margin-top: 10px; gap: 10px;">
        <button type="button" style="background-color: var(--mc-danger); flex: 1;" onclick="closeProfileModal()">Cancelar</button>
        <button type="button" style="flex: 1;" onclick="saveProfileModal()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yclanqvpverqbyidpvjm.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljbGFucXZwdmVycWJ5aWRwdmptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMDYwNzEsImV4cCI6MjEwMzg4MjA3MX0.qyG1dfdMVdb0pkKd_Dv9Y5xoOxx9qBGlKfdscp8oR6E';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function getCreatorBadge(username, email) {
      if (
        username && username.trim().toLowerCase() === "richard" && 
        email && email.trim().toLowerCase() === "rbenavides986@gmail.com"
      ) {
        return `<span style="background: #2e7d32; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-left: 6px;" title="Creador Oficial del Sitio">✔ Creador</span>`;
      }
      return '';
    }

    let loadedAddons = [];
    let filteredAddonsList = [];
    let currentPage = 1;
    const itemsPerPage = 6;

    function sanitizeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
    }

    function renderProfile() {
        let user = JSON.parse(localStorage.getItem('mocraft_current_user'));
        
        if (!user) {
            user = { username: "", email: "", bio: "", avatar: "", yt: "", tk: "", dc: "" };
        }
        
        const usernameEl = document.getElementById('profileUsername');
        const emailEl = document.getElementById('profileEmail');
        const bioEl = document.getElementById('profileBio');
        const avatarEl = document.getElementById('profileAvatar');
        const socialsEl = document.getElementById('profileSocials');

        if (usernameEl) usernameEl.innerHTML = (user.username || "Sin Nombre") + getCreatorBadge(user.username, user.email);
        if (emailEl) emailEl.innerText = user.email || "correo@ejemplo.com";
        if (bioEl) bioEl.innerText = user.bio || "Sin biografía.";
        if (avatarEl) avatarEl.src = user.avatar || "https://via.placeholder.com/100?text=MC";

        if (socialsEl) {
            let socialsHTML = '';
            if (user.yt) socialsHTML += `YouTube: ${user.yt}<br>`;
            if (user.tk) socialsHTML += `TikTok: ${user.tk}<br>`;
            if (user.dc) socialsHTML += `Discord: ${user.dc}`;
            socialsEl.innerHTML = socialsHTML;
        }
    }

    function editProfileModal() {
        let user = JSON.parse(localStorage.getItem('mocraft_current_user')) || {
            username: "", email: "", bio: "", avatar: "", yt: "", tk: "", dc: ""
        };

        document.getElementById('modalUsername').value = user.username || '';
        document.getElementById('modalEmail').value = user.email || '';
        document.getElementById('modalBio').value = user.bio || '';
        document.getElementById('modalAvatar').value = user.avatar || '';
        document.getElementById('modalYt').value = user.yt || '';
        document.getElementById('modalTk').value = user.tk || '';
        document.getElementById('modalDc').value = user.dc || '';

        document.getElementById('profileModal').style.display = 'flex';
    }

    function closeProfileModal() {
        document.getElementById('profileModal').style.display = 'none';
    }

    function saveProfileModal() {
        const user = {
            username: document.getElementById('modalUsername').value.trim(),
            email: document.getElementById('modalEmail').value.trim(),
            bio: document.getElementById('modalBio').value.trim(),
            avatar: document.getElementById('modalAvatar').value.trim(),
            yt: document.getElementById('modalYt').value.trim(),
            tk: document.getElementById('modalTk').value.trim(),
            dc: document.getElementById('modalDc').value.trim()
        };

        localStorage.setItem('mocraft_current_user', JSON.stringify(user));
        closeProfileModal();
        renderProfile();
    }
    
    function resetProfile() {
        localStorage.removeItem('mocraft_current_user');
        alert('Sesión cerrada correctamente');
        window.location.reload();
    }

    function compressImage(file, maxWidth = 800, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
        };
      });
    }

    async function loadAddons() {
      try {
        const { data, error } = await _supabase
          .from('Mods')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        loadedAddons = data || [];
        filterAddons();
      } catch (err) {
        console.error('Error al cargar contenido de Supabase:', err.message || err);
      }
    }

    const addonForm = document.getElementById('addonForm');
    addonForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "Procesando y Guardando...";
      btn.disabled = true;

      try {
        const user = JSON.parse(localStorage.getItem('mocraft_current_user'));
        const author = user && user.username ? user.username : 'Anónimo';

        const title = sanitizeHTML(document.getElementById('title').value);
        const edition = sanitizeHTML(document.getElementById('edition').value);
        const mcVersion = sanitizeHTML(document.getElementById('mcVersion').value);
        const category = sanitizeHTML(document.getElementById('category').value);
        const description = sanitizeHTML(document.getElementById('description').value);

        const mainImageFile = document.getElementById('image').files[0];
        const mainImageBase64 = await compressImage(mainImageFile, 600, 0.6);

        const screenshotFiles = Array.from(document.getElementById('screenshots').files).slice(0, 3);
        const screenshotsBase64 = [];
        for (const file of screenshotFiles) {
          const base64 = await compressImage(file, 500, 0.6);
          screenshotsBase64.push(base64);
        }

        const modFile = document.getElementById('modFile').files[0];

        const newAddon = {
            const newAddon = {
          title,
          edition,
          mcVersion,
          category,
          description,
          author,
          mainImage: mainImageBase64,
          screenshots: screenshotsBase64,
          fileName: modFile ? modFile.name : 'archivo',
          fileSize: modFile ? (modFile.size / (1024 * 1024)).toFixed(2) + ' MB' : '0 MB',
          likes: 0
        };

        const { error } = await _supabase.from('Mods').insert([newAddon]);
        if (error) throw error;

        alert('¡Contenido publicado con éxito!');
        addonForm.reset();
        switchTab('exploreTab');
        loadAddons();
      } catch (err) {
        console.error('Error al subir el contenido:', err.message || err);
        alert('Hubo un error al publicar el contenido. Revisa que las columnas en Supabase coincidan con los datos y que el tamaño de las imágenes no sature la base de datos.');
      } finally {
        btn.innerText = "Publicar Inmediatamente";
        btn.disabled = false;
      }
    });

    function filterAddons() {
      const searchTxt = document.getElementById('searchInput').value.toLowerCase();
      const catVal = document.getElementById('filterCategory').value;
      const verVal = document.getElementById('filterVersion').value;

      filteredAddonsList = loadedAddons.filter(item => {
        const matchesTitle = item.title && item.title.toLowerCase().includes(searchTxt);
        const matchesCat = (catVal === 'all') || (item.category === catVal);
        const matchesVer = (verVal === 'all') || (item.mcVersion === verVal);
        return matchesTitle && matchesCat && matchesVer;
      });

      currentPage = 1;
      renderAddonsGrid();
      renderPagination();
    }

    function renderAddonsGrid() {
      const grid = document.getElementById('addonsGrid');
      grid.innerHTML = '';

      if (filteredAddonsList.length === 0) {
        grid.innerHTML = `<div class="empty-state">No se encontró contenido publicado.</div>`;
        return;
      }

      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const pageItems = filteredAddonsList.slice(start, end);

      pageItems.forEach(item => {
        let editionClass = 'edition-bedrock';
        if (item.edition === 'Java Edition') editionClass = 'edition-java';
        if (item.edition === 'Java & Bedrock') editionClass = 'edition-both';

        let screenshotsHTML = '';
        if (item.screenshots && Array.isArray(item.screenshots) && item.screenshots.length > 0) {
          screenshotsHTML = `<div class="card-screenshots">` + 
            item.screenshots.map(s => `<img src="${s}" alt="Screen">`).join('') + 
            `</div>`;
        }

        const currentUser = JSON.parse(localStorage.getItem('mocraft_current_user'));
        const isAuthor = currentUser && currentUser.username && currentUser.username === item.author;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            ${item.mainImage ? `<img class="main-img" src="${item.mainImage}" alt="Main">` : ''}
            ${screenshotsHTML}
            <div>
              <span class="edition-badge ${editionClass}">${item.edition}</span>
              <span class="version-tag">${item.mcVersion}</span>
            </div>
            <h3 class="card-title">${item.title}</h3>
            <div class="card-author">Por: ${item.author}</div>
            <p class="card-desc">${item.description}</p>
          </div>
          <div>
            <div class="card-actions">
              <button class="btn-like" onclick="likeAddon(${item.id})">❤️ ${item.likes || 0}</button>
              <span style="font-size: 0.8rem; color: var(--mc-text-muted);">${item.fileSize || ''}</span>
            </div>
            <button class="btn-download" onclick="alert('Descargando archivo: ${item.fileName || 'Mod'}')">Descargar</button>
            ${isAuthor ? `<button class="btn-delete" onclick="deleteAddon(${item.id})">Eliminar</button>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderPagination() {
      const paginationContainer = document.getElementById('paginationContainer');
      paginationContainer.innerHTML = '';

      const totalPages = Math.ceil(filteredAddonsList.length / itemsPerPage);
      if (totalPages <= 1) return;

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.innerText = i;
        if (i === currentPage) btn.className = 'active';
        btn.onclick = () => {
          currentPage = i;
          renderAddonsGrid();
          renderPagination();
        };
        paginationContainer.appendChild(btn);
      }
    }

    async function likeAddon(id) {
      const item = loadedAddons.find(a => a.id === id);
      if (!item) return;
      const newLikes = (item.likes || 0) + 1;

      try {
        const { error } = await _supabase
          .from('Mods')
          .update({ likes: newLikes })
          .eq('id', id);

        if (error) throw error;
        item.likes = newLikes;
        renderAddonsGrid();
      } catch (err) {
        console.error('Error al dar like:', err);
      }
    }

    async function deleteAddon(id) {
      if (!confirm('¿Estás seguro de que deseas eliminar este contenido?')) return;

      try {
        const { error } = await _supabase
          .from('Mods')
          .delete()
          .eq('id', id);

        if (error) throw error;
        alert('Contenido eliminado correctamente.');
        loadAddons();
      } catch (err) {
        console.error('Error al eliminar:', err);
        alert('No se pudo eliminar el contenido.');
      }
    }

    window.onload = () => {
      renderProfile();
      loadAddons();
    };
  </script>
</body>
</html>
