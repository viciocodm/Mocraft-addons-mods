<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addons Craft - Minecraft</title>
  <style>
    :root {
      --mc-bg: #121212;
      --mc-surface: #1e1e1e;
      --mc-accent: #388e3c;
      --mc-accent-hover: #2e7d32;
      --mc-text: #ffffff;
      --mc-text-muted: #aaaaaa;
      --mc-border: #333333;
      --mc-danger: #d32f2f;
      --mc-bg-overlay: rgba(0, 0, 0, 0.7);
    }

    .light-mode {
      --mc-bg: #f4f4f9;
      --mc-surface: #ffffff;
      --mc-accent: #4caf50;
      --mc-accent-hover: #388e3c;
      --mc-text: #212121;
      --mc-text-muted: #666666;
      --mc-border: #e0e0e0;
      --mc-danger: #f44336;
      --mc-bg-overlay: rgba(255, 255, 255, 0.7);
    }

    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: var(--mc-bg);
      color: var(--mc-text);
      margin: 0;
      padding: 0;
      transition: background 0.3s, color 0.3s;
    }

    header {
      background-color: var(--mc-surface);
      border-bottom: 2px solid var(--mc-border);
      padding: 1rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    h1 { margin: 0; font-size: 1.5rem; color: var(--mc-accent); }

    nav { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    
    button, .btn {
      background-color: var(--mc-accent);
      color: white;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover, .btn:hover { background-color: var(--mc-accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-secondary { background-color: #555; }
    .btn-secondary:hover { background-color: #444; }

    main { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Filtros y Búsqueda */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    input[type="text"], input[type="email"], input[type="url"], select, textarea {
      background-color: var(--mc-surface);
      color: var(--mc-text);
      border: 1px solid var(--mc-border);
      padding: 0.6rem;
      border-radius: 4px;
      width: 100%;
    }
    .filter-bar input, .filter-bar select { width: auto; flex: 1; min-width: 140px; }

    /* Grid de Mods */
    .addons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--mc-surface);
      border: 1px solid var(--mc-border);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card img.main-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }

    .card-screenshots {
      display: flex;
      gap: 0.3rem;
      margin-bottom: 0.5rem;
      overflow-x: auto;
    }
    .card-screenshots img { width: 60px; height: 40px; object-fit: cover; border-radius: 2px; }

    .card-title { margin: 0.5rem 0 0.2rem 0; font-size: 1.2rem; }
    .card-author { font-size: 0.85rem; color: var(--mc-text-muted); margin-bottom: 0.5rem; }
    
    .edition-badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .edition-bedrock { background-color: #0288d1; color: white; }
    .edition-java { background-color: #e65100; color: white; }
    .edition-both { background-color: #7b1fa2; color: white; }
    
    .version-tag {
      background-color: var(--mc-border);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .card-desc { font-size: 0.9rem; margin: 0.8rem 0; color: var(--mc-text-muted); }

    .card-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .btn-like { background: none; border: 1px solid var(--mc-border); color: var(--mc-text); cursor: pointer; border-radius: 4px; padding: 0.3rem 0.6rem; }
    .btn-download { width: 100%; margin-top: 0.5rem; background-color: var(--mc-accent); }
    .btn-delete { width: 100%; margin-top: 0.3rem; background-color: var(--mc-danger); }

    /* Formularios y Perfil */
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-weight: bold; }
    
    .profile-card {
      background-color: var(--mc-surface);
      padding: 1.5rem;
      border-radius: 8px;
      border: 1px solid var(--mc-border);
      max-width: 500px;
    }
    .profile-avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 1rem; }

    .pagination { display: flex; justify-content: center; gap: 0.5rem; margin-top: 1.5rem; }
    .pagination button.active { background-color: var(--mc-accent-hover); text-decoration: underline; }

    .empty-state { text-align: center; grid-column: 1 / -1; padding: 3rem 1rem; color: var(--mc-text-muted); }
  </style>
</head>
<body>

  <header>
    <h1>Addons Craft</h1>
    <nav>
      <button type="button" onclick="switchTab('exploreTab')">Explorar</button>
      <button type="button" onclick="switchTab('uploadTab')">+ Subir Mod</button>
      <button type="button" onclick="switchTab('profileTab')">Mi Perfil</button>
      <button type="button" class="btn-secondary" onclick="toggleTheme()">🌙 Modo Oscuro</button>
    </nav>
  </header>

  <main>
    <section id="exploreTab" class="tab-content active">
      <h2>Contenido Publicado</h2>
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="Buscar por título..." oninput="filterAddons()">
        
        <select id="filterCategory" onchange="filterAddons()">
          <option value="all">Todas las categorías</option>
          <option value="Mods / Addons">Mods / Addons</option>
          <option value="Mapas">Mapas</option>
          <option value="Texturas">Texturas</option>
          <option value="Skins">Skins</option>
        </select>

        <select id="filterVersion" onchange="filterAddons()">
          <option value="all">Todas las versiones</option>
          <option value="1.26">Minecraft 1.26</option>
          <option value="1.25">Minecraft 1.25</option>
          <option value="1.24">Minecraft 1.24</option>
          <option value="1.23">Minecraft 1.23</option>
          <option value="Otra">Otra versión</option>
        </select>
      </div>

      <div id="addonsGrid" class="addons-grid"></div>
      <div id="paginationContainer" class="pagination"></div>
    </section>

    <section id="uploadTab" class="tab-content">
      <h2>Publicar Nuevo Contenido</h2>
      <form id="addonForm" style="max-width: 600px;">
        <div class="form-group">
          <label for="title">Título del Mod/Addon</label>
          <input type="text" id="title" required placeholder="Ej: Furniture Addon v2">
        </div>

        <div class="form-group">
          <label for="edition">Edición</label>
          <select id="edition" required>
            <option value="Bedrock Edition">Bedrock Edition (.mcaddon / .mcpack)</option>
            <option value="Java Edition">Java Edition (.jar)</option>
            <option value="Java & Bedrock">Java & Bedrock</option>
          </select>
        </div>

        <div class="form-group">
          <label for="mcVersion">Versión de Minecraft</label>
          <select id="mcVersion" required>
            <option value="1.26">Minecraft 1.26</option>
            <option value="1.25">Minecraft 1.25</option>
            <option value="1.24">Minecraft 1.24</option>
            <option value="1.23">Minecraft 1.23</option>
            <option value="Otra">Otra / Todas</option>
          </select>
        </div>

        <div class="form-group">
          <label for="category">Categoría</label>
          <select id="category" required>
            <option value="Mods / Addons">Mods / Addons</option>
            <option value="Mapas">Mapas</option>
            <option value="Texturas">Texturas</option>
            <option value="Skins">Skins</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Descripción</label>
          <textarea id="description" rows="4" required placeholder="Describe las funciones de tu creación..."></textarea>
        </div>

        <div class="form-group">
          <label for="image">Imagen Principal (Carátula)</label>
          <input type="file" id="image" accept="image/*" required>
        </div>

        <div class="form-group">
          <label for="screenshots">Capturas de Pantalla Adicionales (Máx. 3)</label>
          <input type="file" id="screenshots" accept="image/*" multiple>
        </div>

        <div class="form-group">
          <label for="modFile">Archivo (.mcaddon, .mcpack, .zip, .jar)</label>
          <input type="file" id="modFile" required>
        </div>

        <div id="preview-container"></div>

        <button type="submit" id="submitBtn">Publicar Inmediatamente</button>
      </form>
    </section>

    <section id="profileTab" class="tab-content">
      <h2>Mi Perfil de Creador</h2>
      
      <div id="profileDisplay" class="profile-card" style="display:none;">
        <img id="viewAvatar" src="" alt="Avatar" class="profile-avatar">
        <h3 id="viewUsername"></h3>
        <p id="viewEmail" style="color: var(--mc-text-muted);"></p>
        <p id="viewBio"></p>
        <div id="viewSocials"></div>
        <br>
        <button type="button" onclick="editProfile()">Editar Perfil</button>
        <button type="button" class="btn-danger" onclick="logout()" style="background-color: var(--mc-danger);">Cerrar Sesión</button>
      </div>

      <form id="profileForm" class="profile-card">
        <h3>Configurar Perfil</h3>
        <div class="form-group">
          <label for="username">Nombre de Usuario / Creador</label>
          <input type="text" id="username" required placeholder="Ej: Ricardo">
        </div>
        <div class="form-group">
          <label for="email">Correo de Contacto</label>
          <input type="email" id="email" required placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
          <label for="bio">Biografía</label>
          <textarea id="bio" rows="3" placeholder="¡Hola! Creo mods de Minecraft..."></textarea>
        </div>
        <div class="form-group">
          <label for="yt">Canal de YouTube (Opcional)</label>
          <input type="url" id="yt" placeholder="https://youtube.com/@tu_canal">
        </div>
        <div class="form-group">
          <label for="tt">TikTok (Opcional)</label>
          <input type="url" id="tt" placeholder="https://tiktok.com/@tu_usuario">
        </div>
        <div class="form-group">
          <label for="avatarFile">Foto de Perfil</label>
          <input type="file" id="avatarFile" accept="image/*">
        </div>
        <button type="submit">Guardar Perfil</button>
      </form>
    </section>
  </main>

  <script>
    // System & Database Initializer
    let db;
    let loadedAddons = [];
    let filteredAddonsList = [];
    let currentPage = 1;
    const itemsPerPage = 6;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("AddonsCraftDB", 1);
        request.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains("files")) {
            dbInstance.createObjectStore("files", { keyPath: "id" });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = (e) => reject("Error al abrir IndexedDB");
      });
    }

    function saveFileToDB(id, file) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction("files", "readwrite");
        const store = tx.objectStore("files");
        const request = store.put({ id, file });
        request.onsuccess = () => resolve();
        request.onerror = () => reject("Error guardando el archivo");
      });
    }

    function getFileFromDB(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction("files", "readonly");
        const store = tx.objectStore("files");
        const request = store.get(id);
        request.onsuccess = () => resolve(request.result ? request.result.file : null);
        request.onerror = () => reject("Error leyendo el archivo");
      });
    }

    function deleteFileFromDB(id) {
      const tx = db.transaction("files", "readwrite");
      tx.objectStore("files").delete(id);
    }

    function sanitizeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function compressImage(file, maxWidth = 800, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(e.target.result);
        };
      });
    }

    // Navigation & UI Tabs
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      const activeTab = document.getElementById(tabId);
      if(activeTab) activeTab.classList.add('active');
      
      if(tabId === 'exploreTab') loadAddons();
      if(tabId === 'profileTab') renderProfile();
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
    }

    // Profile Management
    function renderProfile() {
      const user = JSON.parse(localStorage.getItem('user_profile'));
      const profileDisplay = document.getElementById('profileDisplay');
      const profileForm = document.getElementById('profileForm');

      if (user) {
        document.getElementById('viewAvatar').src = user.avatar || 'https://via.placeholder.com/90?text=Ricardo';
        document.getElementById('viewUsername').innerText = user.username;
        document.getElementById('viewEmail').innerText = user.email;
        document.getElementById('viewBio').innerText = user.bio || 'Sin biografía.';
        
        let socials = '';
        if(user.yt) socials += `<a href="${encodeURI(user.yt)}" target="_blank" style="color:var(--mc-accent); margin-right:1rem;">YouTube</a>`;
        if(user.tt) socials += `<a href="${encodeURI(user.tt)}" target="_blank" style="color:var(--mc-accent);">TikTok</a>`;
        document.getElementById('viewSocials').innerHTML = socials;

        profileDisplay.style.display = 'block';
        profileForm.style.display = 'none';
      } else {
        profileDisplay.style.display = 'none';
        profileForm.style.display = 'block';
      }
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const avatarInput = document.getElementById('avatarFile').files[0];
      const existingUser = JSON.parse(localStorage.getItem('user_profile')) || {};
      let avatarBase64 = existingUser.avatar || 'https://via.placeholder.com/90?text=Ricardo';

      if(avatarInput) {
        avatarBase64 = await compressImage(avatarInput, 200, 0.8);
      }

      const profile = {
        username: sanitizeHTML(document.getElementById('username').value),
        email: sanitizeHTML(document.getElementById('email').value),
        bio: sanitizeHTML(document.getElementById('bio').value),
        yt: sanitizeHTML(document.getElementById('yt').value),
        tt: sanitizeHTML(document.getElementById('tt').value),
        avatar: avatarBase64
      };

      localStorage.setItem('user_profile', JSON.stringify(profile));
      renderProfile();
    });

    function editProfile() {
      const user = JSON.parse(localStorage.getItem('user_profile'));
      if(user) {
        document.getElementById('username').value = user.username;
        document.getElementById('email').value = user.email;
        document.getElementById('bio').value = user.bio || '';
        document.getElementById('yt').value = user.yt || '';
        document.getElementById('tt').value = user.tt || '';
      }
      document.getElementById('profileForm').style.display = 'block';
      document.getElementById('profileDisplay').style.display = 'none';
    }

    function logout() {
      localStorage.removeItem('user_profile');
      renderProfile();
    }

    // Addon Submission & Upload logic
    const addonForm = document.getElementById('addonForm');

    addonForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "Procesando y Guardando...";
      btn.disabled = true;

      try {
        const user = JSON.parse(localStorage.getItem('user_profile'));
        const author = user ? user.username : 'Ricardo';

        const title = sanitizeHTML(document.getElementById('title').value);
        const edition = sanitizeHTML(document.getElementById('edition').value);
        const mcVersion = sanitizeHTML(document.getElementById('mcVersion').value);
        const category = sanitizeHTML(document.getElementById('category').value);
        const description = sanitizeHTML(document.getElementById('description').value);

        const mainImageFile = document.getElementById('image').files[0];
        const mainImageBase64 = await compressImage(mainImageFile, 800, 0.7);

        const screenshotFiles = Array.from(document.getElementById('screenshots').files).slice(0, 3);
        const screenshotsBase64 = [];
        for (const file of screenshotFiles) {
          const base64 = await compressImage(file, 600, 0.7);
          screenshotsBase64.push(base64);
        }

        const modFile = document.getElementById('modFile').files[0];
        const addonId = Date.now();

        await saveFileToDB(addonId, modFile);

        const newAddon = {
          id: addonId,
          title,
          edition,
          mcVersion,
          category,
          description,
          author,
          likes: 0,
          mainImage: mainImageBase64,
          screenshots: screenshotsBase64,
          fileName: modFile.name,
          date: new Date().toLocaleDateString()
        };

        const addons = JSON.parse(localStorage.getItem('addons_list')) || [];
        addons.unshift(newAddon);
        localStorage.setItem('addons_list', JSON.stringify(addons));

        addonForm.reset();
        document.getElementById('preview-container').innerHTML = '';
        alert('¡Contenido publicado exitosamente!');
        switchTab('exploreTab');
      } catch (error) {
        alert('Ocurrió un error al guardar el contenido.');
      } finally {
        btn.innerText = "Publicar Inmediatamente";
        btn.disabled = false;
      }
    });

    // Content Discovery & Rendering
    function loadAddons() {
      loadedAddons = JSON.parse(localStorage.getItem('addons_list')) || [];
      filterAddons();
    }

    function filterAddons() {
      const searchInput = document.getElementById('searchInput');
      const filterCat = document.getElementById('filterCategory');
      const filterVer = document.getElementById('filterVersion');
      if (!searchInput || !filterCat || !filterVer) return;

      const search = searchInput.value.toLowerCase();
      const cat = filterCat.value;
      const ver = filterVer.value;

      filteredAddonsList = loadedAddons.filter(item => {
        const matchesSearch = item.title.toLowerCase().includes(search);
        const matchesCategory = cat === 'all' || item.category === cat;
        const matchesVersion = ver === 'all' || item.mcVersion === ver;
        return matchesSearch && matchesCategory && matchesVersion;
      });

      currentPage = 1;
      renderGrid();
    }

    function toggleLike(id) {
      const addons = JSON.parse(localStorage.getItem('addons_list')) || [];
      const item = addons.find(a => a.id === id);
      if (item) {
        item.likes = (item.likes || 0) + 1;
        localStorage.setItem('addons_list', JSON.stringify(addons));
        loadAddons();
      }
    }

    function renderGrid() {
      const grid = document.getElementById('addonsGrid');
      const pagination = document.getElementById('paginationContainer');
      if (!grid || !pagination) return;
      
      grid.innerHTML = '';
      pagination.innerHTML = '';

      if (filteredAddonsList.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h3>No hay contenido disponible</h3>
            <p>Sé el primero en publicar un mod, mapa o textura en la pestaña "Subir Mod".</p>
          </div>`;
        return;
      }

      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const itemsToDisplay = filteredAddonsList.slice(start, end);

      itemsToDisplay.forEach(item => {
        let badgeClass = 'edition-bedrock';
        if (item.edition === 'Java Edition') badgeClass = 'edition-java';
        if (item.edition === 'Java & Bedrock') badgeClass = 'edition-both';

        let screenshotsHTML = '';
        if (item.screenshots && item.screenshots.length > 0) {
          screenshotsHTML = `<div class="card-screenshots">` +
            item.screenshots.map(src => `<img src="${src}" alt="Screenshot">`).join('') +
            `</div>`;
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <img class="main-img" src="${item.mainImage}" alt="${item.title}">
            ${screenshotsHTML}
            <h3 class="card-title">${item.title}</h3>
            <div class="card-author">Por: <strong>${item.author}</strong></div>
            <div>
              <span class="edition-badge ${badgeClass}">${item.edition}</span>
              <span class="version-tag">v${item.mcVersion || '1.26'}</span>
            </div>
            <p class="card-desc">${item.description}</p>
          </div>
          <div>
            <div class="card-actions">
              <button type="button" class="btn-like" onclick="toggleLike(${item.id})">❤️ ${item.likes || 0}</button>
              <span style="color: gold;">★★★★★</span>
            </div>
            <button type="button" class="btn-download" onclick="downloadAddon(${item.id}, '${item.fileName}')">📦 Descargar (${item.fileName})</button>
            <button type="button" class="btn-delete" onclick="deleteAddon(${item.id})">🗑️ Eliminar</button>
          </div>
        `;
        grid.appendChild(card);
      });

      const totalPages = Math.ceil(filteredAddonsList.length / itemsPerPage);
      if (totalPages > 1) {
        for (let i = 1; i <= totalPages; i++) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.innerText = i;
          if (i === currentPage) btn.className = 'active';
          btn.onclick = () => {
            currentPage = i;
            renderGrid();
          };
          pagination.appendChild(btn);
        }
      }
    }

    async function downloadAddon(id, fileName) {
      try {
        const fileBlob = await getFileFromDB(id);
        if (!fileBlob) {
          alert('El archivo no se encuentra disponible.');
          return;
        }
        const url = URL.createObjectURL(fileBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        alert('Error al descargar el archivo.');
      }
    }

    function deleteAddon(id) {
      if (confirm('¿Estás seguro de que deseas eliminar este contenido?')) {
        deleteFileFromDB(id);
        loadedAddons = loadedAddons.filter(item => item.id !== id);
        localStorage.setItem('addons_list', JSON.stringify(loadedAddons));
        filterAddons();
      }
    }

    // Inicialización al cargar la página
    window.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      loadAddons();
      renderProfile();
    });
  </script>
</body>
</html>
